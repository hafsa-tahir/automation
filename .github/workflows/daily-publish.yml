name: Daily Storybook Generation & Publishing

on:
  schedule:
    # 9:00am UTC every day. Adjust to your timezone by changing the hour
    # (cron is always UTC). Example: for 9am Pakistan time (UTC+5), use "0 4 * * *".
    - cron: "0 9 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run daily generation + publishing
        run: node src/run.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CLOUDFLARE_IMAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_IMAGE_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GUMROAD_DEFAULT_PRICE_CENTS: ${{ vars.GUMROAD_DEFAULT_PRICE_CENTS }}
          BOOKS_PER_DAY: ${{ vars.BOOKS_PER_DAY }}
          AUTHOR_NAME: ${{ vars.AUTHOR_NAME }}
